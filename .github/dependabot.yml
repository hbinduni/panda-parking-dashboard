# Version updates; vulnerability detection runs separately. Major updates stay separate.
version: 2
updates:
  - package-ecosystem: uv
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
